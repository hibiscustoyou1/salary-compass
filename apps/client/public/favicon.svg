<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 极客蓝至深蓝的渐变底蕴 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    
    <!-- 数据流柱状图阴影 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 带圆角的主体卡片 -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" />

  <g filter="url(#glow)">
    <!-- 财富柱状图 -->
    <rect x="140" y="280" width="50" height="110" rx="16" fill="#93c5fd" />
    <rect x="230" y="200" width="50" height="190" rx="16" fill="#60a5fa" />
    <rect x="320" y="120" width="50" height="270" rx="16" fill="#ffffff" />
    
    <!-- 上扬的增长折线折角 -->
    <path d="M 165 240 L 255 160 L 345 80" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <circle cx="345" cy="80" r="24" fill="#ffffff" />
  </g>
</svg>
